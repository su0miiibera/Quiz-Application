<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz Application</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Quiz Application</h1>

        <p class="subtitle">
            Improve your knowledge & skills
        </p>


        <!-- Student Name -->

        <label for="username">
            Enter Your Name
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter your full name"
        >


        <!-- Student Code -->

        <label for="studentCode">
            Student Code
        </label>

        <input
            type="text"
            id="studentCode"
            placeholder="Example: BWU/MCA/26/001"
            maxlength="14"
        >

        <!-- Topic -->

        <label for="topic">
            Choose Your Topic
        </label>

        <input
            type="text"
            id="topic"
            placeholder="Example: Python, DBMS, Java, HTML..."
        >

<label for="question-count">
    Choose How Many Questions
</label>

<input
    type="number"
    id="question-count"
    placeholder="Enter number of questions"
    min="6"
    max="100"
    value="10"
  
>
        <!-- Start Quiz -->

        <button onclick="startQuiz()">
            Start Quiz
        </button>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
